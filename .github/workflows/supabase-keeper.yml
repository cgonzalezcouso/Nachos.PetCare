name: Supabase Keep-Alive Daily Ping

on:
  schedule:
    # Corre automáticamente cada 12 horas (00:00 y 12:00 UTC)
    - cron: '0 */12 * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Mantenedor Supabase
        env:
          # Opcional: Puedes configurar tus proyectos en el Secret SUPABASE_PROJECTS de GitHub
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
          FAIL_ON_ERROR: 'false'
          GH_TOKEN: ${{ github.token }}
        run: npm run ping
