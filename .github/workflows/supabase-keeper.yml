name: Supabase Keep-Alive Daily Ping

on:
  schedule:
    # Corre automáticamente cada 12 horas (00:00 y 12:00 UTC)
    - cron: '0 */12 * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/supabase-keeper/package-lock.json

      - name: Instalar dependencias
        working-directory: tools/supabase-keeper
        run: npm ci

      - name: Comprobar el mantenedor
        working-directory: tools/supabase-keeper
        run: npm test

      - name: Ejecutar Mantenedor Supabase
        working-directory: tools/supabase-keeper
        env:
          # Opcional. JSON: [{"name":"app","url":"https://xxx.supabase.co","key":"..."}]
          # Si no está definido, se usa SUPABASE_URL + SUPABASE_ANON_KEY.
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FAIL_ON_ERROR: 'false'
          GH_TOKEN: ${{ github.token }}
        run: npm run ping
